<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Dark blue circular background matching Music Toolkit and Chord Chart -->
  <circle cx="256" cy="256" r="256" fill="#0c4a6e" />
  
  <!-- Sheet Music Page with folded top-right corner -->
  <path d="M150 110 h130 l72 72 v200 c 0 15 -12 28 -28 28 h-174 c -15 0 -28 -12 -28 -28 v-244 c 0 -15 12 -28 28 -28 z" fill="#ffffff" />
  <!-- Folded corner shadow -->
  <path d="M280 110 v72 h72 z" fill="#cbd5e1" />
  
  <!-- Music Staff Lines cut in primary blue -->
  <rect x="180" y="210" width="140" height="10" rx="5" fill="#0c4a6e" />
  <rect x="180" y="234" width="140" height="10" rx="5" fill="#0c4a6e" />
  <rect x="180" y="258" width="140" height="10" rx="5" fill="#0c4a6e" />
  <rect x="180" y="282" width="140" height="10" rx="5" fill="#0c4a6e" />
  
  <!-- Musical Eighth Note accent on the chart -->
  <circle cx="220" cy="330" r="16" fill="#0c4a6e" />
  <rect x="230" y="280" width="8" height="50" fill="#0c4a6e" />
  <path d="M238 280 c 15 -6, 28 -2, 30 14 c -10 3, -20 -2, -30 -14 z" fill="#0c4a6e" />
