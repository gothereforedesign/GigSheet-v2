<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0c4a6e" />
    <meta name="description" content="Offline sheet music directory, chart viewer, and setlist manager." />
    
    <!-- Chrome, Android & PWA App Configuration -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="GigSheet" />
    
    <!-- iOS / Safari Home Screen Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GigSheet" />
    
    <!-- App Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/pwa-64x64.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/pwa-96x96.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/pwa-128x128.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/pwa-256x256.png" />
    <link rel="icon" type="image/png" sizes="384x384" href="/pwa-384x384.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <title>GigSheet - Sheet Music & Setlists</title>
    <script>
      if ('serviceWorker' in navigator && !window.location.host.includes('ais-dev-')) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('PWA ServiceWorker active:', reg.scope);
            })
            .catch(function(err) {
              console.log('ServiceWorker note:', err);
            });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
